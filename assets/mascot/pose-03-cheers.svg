<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 280" width="200" height="200" role="img" aria-label="Slither mascot, cheers">
<style>.sk{fill:none;stroke:url(#g);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.sk2{fill:none;stroke:url(#scales);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.belly{fill:none;stroke:#d9f5a6;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.head{fill:#7bd24a;stroke:#2a9d4f;stroke-width:3}
.snout{fill:#9be36a}
.eye{fill:#fff}.iris{fill:#ffd84d}.pupil{fill:#111}.glint{fill:#fff}
.brow{fill:none;stroke:#1f6b36;stroke-width:4;stroke-linecap:round}
.mouth{fill:#5a1430;stroke:#1f6b36;stroke-width:3;stroke-linejoin:round}
.lip{fill:none;stroke:#1f6b36;stroke-width:3.5;stroke-linecap:round}
.fang{fill:#fff;stroke:#1f6b36;stroke-width:1.5;stroke-linejoin:round}
.tongue{fill:#ff3d6e;stroke:#c2184a;stroke-width:1.5;stroke-linejoin:round}
.blush{fill:#ff7a59;opacity:.45}</style>
<defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a9d4f"/><stop offset=".5" stop-color="#7bd24a"/><stop offset="1" stop-color="#3cae5c"/></linearGradient>
      <pattern id="scales" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><path d="M.5,.5 h8 v8 h-8 z" fill="rgba(0,0,0,.18)" stroke="rgba(255,255,255,.22)" stroke-width=".8"/></pattern>
    </defs>
<g transform="translate(0,-20)"><path class="sk" d="M80,245 C130,255 185,240 175,195 C166,160 110,160 118,122 C124,96 160,92 182,100"/>
      <path class="sk2" d="M80,245 C130,255 185,240 175,195 C166,160 110,160 118,122 C124,96 160,92 182,100"/>
      <path class="belly" d="M82,253 C132,263 193,246 183,195"/>
      <g transform="translate(206,58)">
        <path d="M-14,0 h28 l-4,40 h-20 z" fill="rgba(255,255,255,.12)" stroke="#f5f0e4" stroke-width="3" stroke-linejoin="round"/>
        <path d="M-10,16 h20 l-2,22 h-16 z" fill="#ff7a59"/>
        <path d="M0,40 v14 M-10,54 h20" stroke="#f5f0e4" stroke-width="3" stroke-linecap="round"/>
        <circle cx="4" cy="8" r="3" fill="#fff" opacity=".8"/>
      </g>
      <g transform="translate(72,236) rotate(-10)">
        <ellipse class="head" cx="0" cy="0" rx="42" ry="36"/>
        <ellipse class="snout" cx="0" cy="16" rx="24" ry="13"/>
        <!-- half-lidded eyes: top of eye cut by lid -->
        <ellipse class="eye" cx="-15" cy="-6" rx="13" ry="12"/><ellipse class="eye" cx="15" cy="-6" rx="13" ry="12"/>
        <circle class="iris" cx="-14" cy="-4" r="8"/><circle class="iris" cx="16" cy="-4" r="8"/>
        <ellipse class="pupil" cx="-13" cy="-4" rx="2.6" ry="6"/><ellipse class="pupil" cx="17" cy="-4" rx="2.6" ry="6"/>
        <path d="M-28,-14 h26 v6 h-26 z M2,-14 h26 v6 h-26 z" fill="#7bd24a"/>
        <path class="lip" d="M-27,-9 h25 M3,-9 h25"/>
        <path class="brow" d="M-27,-20 q12,-5 24,-3"/><path class="brow" d="M3,-23 q12,-2 24,3"/>
        <!-- big open grin -->
        <path class="mouth" d="M-26,10 Q0,40 26,10 Q0,18 -26,10 z"/>
        <path d="M-18,13 Q0,22 18,13" fill="#ff8aa8" opacity=".8"/>
        <path class="fang" d="M-16,12 l3,9 l4,-8 z"/><path class="fang" d="M9,12 l4,8 l3,-9 z"/>
        <ellipse class="blush" cx="-32" cy="8" rx="8" ry="5"/><ellipse class="blush" cx="32" cy="8" rx="8" ry="5"/>
      </g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 280" width="200" height="200" role="img" aria-label="Slither mascot, shades">
<style>.sk{fill:none;stroke:url(#g);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.sk2{fill:none;stroke:url(#scales);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.belly{fill:none;stroke:#d9f5a6;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.head{fill:#7bd24a;stroke:#2a9d4f;stroke-width:3}
.snout{fill:#9be36a}
.eye{fill:#fff}.iris{fill:#ffd84d}.pupil{fill:#111}.glint{fill:#fff}
.brow{fill:none;stroke:#1f6b36;stroke-width:4;stroke-linecap:round}
.mouth{fill:#5a1430;stroke:#1f6b36;stroke-width:3;stroke-linejoin:round}
.lip{fill:none;stroke:#1f6b36;stroke-width:3.5;stroke-linecap:round}
.fang{fill:#fff;stroke:#1f6b36;stroke-width:1.5;stroke-linejoin:round}
.tongue{fill:#ff3d6e;stroke:#c2184a;stroke-width:1.5;stroke-linejoin:round}
.blush{fill:#ff7a59;opacity:.45}</style>
<defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a9d4f"/><stop offset=".5" stop-color="#7bd24a"/><stop offset="1" stop-color="#3cae5c"/></linearGradient>
      <pattern id="scales" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><path d="M.5,.5 h8 v8 h-8 z" fill="rgba(0,0,0,.18)" stroke="rgba(255,255,255,.22)" stroke-width=".8"/></pattern>
    </defs>
<g transform="translate(0,-20)"><path class="sk" d="M133,230 C60,230 60,150 133,150 C206,150 206,80 133,80"/>
      <path class="sk2" d="M133,230 C60,230 60,150 133,150 C206,150 206,80 133,80"/>
      <path class="belly" d="M133,237 C66,237 66,157 133,157"/>
      <g transform="translate(133,226) rotate(4)">
        <ellipse class="head" cx="0" cy="0" rx="46" ry="38"/>
        <ellipse class="snout" cx="0" cy="18" rx="26" ry="14"/>
        <path class="brow" d="M-30,-28 q12,-6 26,-2"/><path class="brow" d="M6,-30 q12,-6 26,0"/>
        <!-- shades -->
        <path d="M-46,-10 h92" stroke="#111" stroke-width="4" stroke-linecap="round"/>
        <rect x="-36" y="-18" width="30" height="22" rx="8" fill="#111"/><rect x="6" y="-18" width="30" height="22" rx="8" fill="#111"/>
        <path d="M-30,-13 h12" stroke="#36d6c3" stroke-width="3" stroke-linecap="round"/><path d="M12,-13 h12" stroke="#36d6c3" stroke-width="3" stroke-linecap="round"/>
        <path d="M-2,-6 q2,0 4,0" stroke="#111" stroke-width="4" stroke-linecap="round"/>
        <!-- one-sided smirk -->
        <path class="mouth" d="M-14,16 Q4,30 26,12 Q8,22 -14,16 z"/>
        <path class="fang" d="M16,14 l3,8 l4,-7 z"/>
        <path class="tongue" d="M-10,18 q-6,8 -2,13 q4,-2 6,-6 q2,4 6,5 q2,-8 -4,-12 z"/>
        <ellipse class="blush" cx="36" cy="10" rx="7" ry="4"/>
      </g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 280" width="200" height="200" role="img" aria-label="Slither mascot, wave">
<style>.sk{fill:none;stroke:url(#g);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.sk2{fill:none;stroke:url(#scales);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.belly{fill:none;stroke:#d9f5a6;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.head{fill:#7bd24a;stroke:#2a9d4f;stroke-width:3}
.snout{fill:#9be36a}
.eye{fill:#fff}.iris{fill:#ffd84d}.pupil{fill:#111}.glint{fill:#fff}
.brow{fill:none;stroke:#1f6b36;stroke-width:4;stroke-linecap:round}
.mouth{fill:#5a1430;stroke:#1f6b36;stroke-width:3;stroke-linejoin:round}
.lip{fill:none;stroke:#1f6b36;stroke-width:3.5;stroke-linecap:round}
.fang{fill:#fff;stroke:#1f6b36;stroke-width:1.5;stroke-linejoin:round}
.tongue{fill:#ff3d6e;stroke:#c2184a;stroke-width:1.5;stroke-linejoin:round}
.blush{fill:#ff7a59;opacity:.45}</style>
<defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a9d4f"/><stop offset=".5" stop-color="#7bd24a"/><stop offset="1" stop-color="#3cae5c"/></linearGradient>
      <pattern id="scales" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><path d="M.5,.5 h8 v8 h-8 z" fill="rgba(0,0,0,.18)" stroke="rgba(255,255,255,.22)" stroke-width=".8"/></pattern>
    </defs>
<g transform="translate(0,-20)"><path class="sk" d="M80,240 C130,240 120,150 170,140 C215,132 205,80 232,66"/>
      <path class="sk2" d="M80,240 C130,240 120,150 170,140 C215,132 205,80 232,66"/>
      <path class="belly" d="M84,247 C132,247 124,157 172,147"/>
      <path d="M232,66 l10,-14" fill="none" stroke="#7bd24a" stroke-width="10" stroke-linecap="round"/>
      <g transform="translate(70,230) rotate(6)">
        <ellipse class="head" cx="0" cy="0" rx="42" ry="36"/>
        <ellipse class="snout" cx="0" cy="16" rx="24" ry="13"/>
        <!-- wink: left closed, right wide -->
        <path class="lip" d="M-26,-8 q11,7 22,0"/>
        <ellipse class="eye" cx="15" cy="-8" rx="13" ry="14"/><circle class="iris" cx="16" cy="-7" r="8"/><ellipse class="pupil" cx="17" cy="-7" rx="2.6" ry="6.5"/><circle class="glint" cx="20" cy="-11" r="2.4"/>
        <path class="brow" d="M-28,-22 q12,-4 24,-2"/><path class="brow" d="M6,-28 q10,-8 22,-2"/>
        <path class="mouth" d="M-22,12 Q0,30 24,12 Q4,22 -22,12 z"/>
        <path class="fang" d="M-12,13 l3,8 l4,-7 z"/>
        <path class="tongue" d="M16,15 q8,6 6,13 q-5,-1 -7,-5 q-1,4 -5,6 q-3,-8 2,-13 z"/>
        <ellipse class="blush" cx="-32" cy="8" rx="7" ry="4"/><ellipse class="blush" cx="32" cy="8" rx="7" ry="4"/>
      </g></g>
</svg>

<body>
<title>Slither</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Fixed wordmark header, five-tab bar, each tab scrolls on its own.
   The hand-drawn Queenstown CBD map is the hero; the snake route is the brand. Dark-only by design (it's a night-out app). */
:root{
  --bg:#0b0f1f; --bg2:#111631; --surface:#182043; --surface2:#1f2a55; --line:#2a3566;
  --fg:#f5f0e4; --muted:#9ea8cf; --accent:#ff7a59; --accent-ink:#2a0f06; --teal:#36d6c3;
  --lake:#0f2f44; --lake2:#0c2538; --land:#161c38; --street:#2b3769; --street-ink:#6c79b3; --park:#1a3a38;
  --good:#6fdc8c; --warn:#ffcf5c; --danger:#ff6b6b;
  --display:'Bricolage Grotesque','Avenir Next Condensed','Arial Narrow',sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.wordmark{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;line-height:1}
.wordmark em{font-style:normal;color:var(--teal)}
.pill{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.pill.live{color:var(--good);border-color:var(--good)}
.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
main{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.tab{padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto;width:100%}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg2);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;cursor:pointer}
.tabbar button .ico{font-size:20px;line-height:1}
.tabbar button.on{color:var(--accent)}
.tabbar button:focus-visible{outline:2px solid var(--teal)}
h2{font-family:var(--display);font-size:22px;font-weight:800;margin:0;text-wrap:balance;line-height:1.15}
h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hot{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;line-height:1.2;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#042523}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.icon{padding:0;width:32px;min-height:32px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--fg)}
label.chk input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#042523}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--bg2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.ex{color:var(--warn);border-color:var(--warn)}
.badge.live{color:var(--good);border-color:var(--good)}
.badge.cat{color:var(--teal);border-color:var(--teal)}
.badge.star{color:#ffd84d;border-color:#ffd84d;background:rgba(255,216,77,.1)}
.card.starred{border-color:rgba(255,216,77,.55)}
.star{fill:#ffd84d;stroke:#7a5a00;stroke-width:.8;pointer-events:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.item .n{font-weight:600}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-family:var(--display);display:flex;align-items:center;justify-content:center;font-size:14px}
.num.done{background:var(--good);color:#06240f}
.num.now{background:var(--teal);color:#042523;box-shadow:0 0 0 4px rgba(54,214,195,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:var(--lake2);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.mapwrap svg{display:block;width:100%;height:auto;max-width:100%}
.mapwrap .zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapwrap .legend{position:absolute;left:8px;bottom:8px;font-size:10.5px;color:var(--muted);background:rgba(11,15,31,.75);padding:3px 7px;border-radius:6px}
.pin{cursor:pointer}
.pin circle.dot{fill:var(--surface2);stroke:var(--teal);stroke-width:1.6}
.pin.planned circle.dot{fill:var(--accent);stroke:var(--accent)}
.pin.done circle.dot{fill:var(--good);stroke:var(--good)}
.pin.now circle.dot{fill:var(--teal);stroke:var(--fg);stroke-width:2}
.pin text{fill:var(--fg);font-family:var(--body);font-size:9px;font-weight:500;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.pin text.num{fill:var(--accent-ink);font-weight:800;font-size:9px;stroke:none;text-anchor:middle;pointer-events:none}
.pin.done text.num{fill:#06240f}
.pin.now text.num{fill:#042523}
.rc{stroke:#0d1130;stroke-linecap:round}
.rf{stroke:#303a73;stroke-linecap:round}
.rm{stroke:rgba(255,255,255,.16);stroke-width:.8;stroke-dasharray:5 6}
.shore{fill:none;stroke:#1b4d68;stroke-width:12;opacity:.55;stroke-linejoin:round}
.wave{fill:none;stroke:#2a6a8a;stroke-width:1;opacity:.5}
.stl{fill:var(--street-ink);font-size:8.5px;font-family:var(--body);text-anchor:middle;letter-spacing:.04em;pointer-events:none}
.wl{fill:#3f7f9a;font-size:11px;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.pk{fill:var(--park)}
.sk-outline{fill:none;stroke:#174d2a;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.sk-fill{fill:none;stroke:url(#snakeGrad);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.sk-scales{fill:none;stroke:url(#scales);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.sk-spine{fill:none;stroke:#0f3d1f;stroke-width:2.4;stroke-dasharray:4 7;stroke-linecap:round;opacity:.75}
.sk-tail{fill:#2f9a4f;stroke:#174d2a;stroke-width:1.2}
.snakeg{animation:wiggle 1.3s ease-in-out infinite alternate}
@keyframes wiggle{0%{transform:translate(-2.2px,1.3px)}100%{transform:translate(2.2px,-1.3px)}}
.sk-spine{animation:crawl 1.1s linear infinite}
@keyframes crawl{to{stroke-dashoffset:-11}}
.head{transform-box:fill-box;transform-origin:12% 50%;animation:bob 1.7s ease-in-out infinite alternate}
@keyframes bob{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}
.tongue{transform-box:fill-box;transform-origin:0 50%;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,62%{transform:scaleX(0)}70%,86%{transform:scaleX(1)}94%,100%{transform:scaleX(0)}}
.dancing .snakeg{animation-name:groove;animation-duration:var(--beat,.54s)}
@keyframes groove{0%{transform:translate(-3.5px,2px)}100%{transform:translate(3.5px,-2px)}}
.dancing .head{animation-name:headbang;animation-duration:var(--beat,.54s)}
@keyframes headbang{0%{transform:rotate(-18deg) scale(1)}50%{transform:rotate(0) scale(1.1)}100%{transform:rotate(18deg) scale(1)}}
.dancing .sk-spine{animation-duration:calc(var(--beat,.54s)/2)}
.pop{transform-box:fill-box;transform-origin:center}
.pop.wink{animation:pop .9s ease-out 1}
@keyframes pop{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.45) rotate(-12deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.eye{transform-box:fill-box;transform-origin:center}
.pop.wink .eye-r{animation:wink .9s ease-in-out 1}
@keyframes wink{0%,22%{transform:scaleY(1)}35%,65%{transform:scaleY(.08)}80%,100%{transform:scaleY(1)}}
.pill.music{cursor:pointer;font:inherit;font-size:15px;padding:4px 9px;line-height:1.2}
.pill.music.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(54,214,195,.18)}
.pill+.pill{margin-left:0}
@media (prefers-reduced-motion:reduce){.snakeg,.sk-spine,.head,.tongue,.pop,.eye{animation:none!important}}
.snake-plan{fill:none;stroke:#7bd24a;stroke-width:3;stroke-dasharray:5 7;opacity:.6;stroke-linecap:round}
.rank{flex:none;width:26px;font-family:var(--display);font-weight:800;color:var(--muted);font-size:15px;text-align:center}
.score{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--teal)}
.item.mine{border-color:var(--teal);background:rgba(54,214,195,.08)}
.trail{fill:none;stroke:var(--teal);stroke-width:2.5;opacity:.85;stroke-linecap:round;stroke-linejoin:round}
.you{fill:var(--teal);stroke:var(--fg);stroke-width:2}
.you-ring{fill:none;stroke:var(--teal);stroke-width:2;opacity:.5;animation:ring 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos.wide{grid-template-columns:repeat(2,1fr)}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;right:4px;bottom:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88%;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center;transition:opacity .25s;pointer-events:none}
.toast[hidden]{display:none}
.code{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:.08em;text-align:center;background:var(--bg2);border:2px dashed var(--accent);border-radius:14px;padding:18px 10px;font-variant-numeric:tabular-nums}
.cap{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;user-select:text;-webkit-user-select:text;word-break:break-word}
.water{background:linear-gradient(135deg,#153a52,#1a2a5a);border:1px solid #2d5f80}
details summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:13px}
details p{margin-top:8px}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:28px}
.ts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.file{display:none}
.rowbtns{display:flex;gap:4px;flex:none}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.empty{color:var(--muted);text-align:center;padding:18px 10px;font-size:14px}
@media (prefers-reduced-motion:reduce){.you-ring,.pill.live::before{animation:none}}
@media (min-width:700px){.photos{grid-template-columns:repeat(4,1fr)}}
</style>

<div id="app">
  <header class="top">
    <div class="wordmark">🐍 Slither<em>.</em></div>
    <button class="pill music" id="musicBtn" aria-pressed="false" aria-label="Snake music">🔇</button><div class="pill" id="statusPill">Queenstown</div>
  </header>
  <main id="main">
    <section class="tab" id="tab-map"></section>
    <section class="tab" id="tab-plan" hidden></section>
    <section class="tab" id="tab-live" hidden></section>
    <section class="tab" id="tab-deals" hidden></section>
    <section class="tab" id="tab-recap" hidden></section>
  </main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="map"><span class="ico">🗺️</span>Map</button>
    <button data-tab="plan"><span class="ico">🐍</span>Plan</button>
    <button data-tab="live"><span class="ico">📍</span>Tonight</button>
    <button data-tab="deals"><span class="ico">🏷️</span>Deals</button>
    <button data-tab="recap"><span class="ico">📸</span>Recap</button>
  </nav>
  <div id="sheetHost"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Queenstown data (stylised map units; 1 unit ≈ 1.6 m). Pins are approximate. ---------- */
const BARS = [

  {id:'world-bar',        name:'World Bar',        area:'Shotover St',   x:236, y:172, vibe:'Teapots and a dancefloor', tags:['dancefloor','late']},
  {id:'pog-mahones',      name:"Pog Mahone's",     area:'Rees St',       x:226, y:262, vibe:'Irish pub, live tunes', tags:['live music','food']},

  {id:'yonder',           name:'Yonder',           area:'Church St',     x:372, y:322, vibe:'Good food, live sets', tags:['food','live music']},

  {id:'lucky-lukes',      name:'Lucky Lukes',      area:'The Mall',      x:322, y:300, vibe:'Good luck getting out early', tags:['late','dancefloor'], star:'Recommended'},
  {id:'soho',             name:'Soho',             area:'Church St',     x:388, y:296, vibe:'Late, loud, lovely', tags:['late','cocktails']},
  {id:'the-club',         name:'The Club',         area:'Cow Lane',      x:298, y:248, vibe:'Where the night ends', tags:['dancefloor','late']},

const SUGGESTED = [
  {name:"Off me 'Ed", ids:['barmuda','bardeaux','lucky-lukes','soho'], blurb:'Lane-hopping classic. Cocktails, wine, then it gets loose.'},
  {name:'Blair Stitch Project', ids:['lucky-lukes','barmuda','bardeaux','the-club'], blurb:'Start loud, settle in, finish on the dancefloor.'},
];
const byId = Object.fromEntries(BARS.map(b => [b.id, b]));
const starBadge = b => b.star ? ` <span class="badge star">★ ${esc(b.star)}</span>` : '';

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;

}

const views = {};
const MINW = 140, MAXW = MAP_W * 1.3;

function setView(id, v){

document.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  const p = ptrs.get(e.pointerId); p.x = e.clientX; p.y = e.clientY;
  if (gesture.type === 'pinch' && ptrs.size === 2){
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (!d || !gesture.d0) return;
    const w = Math.min(MAXW, Math.max(MINW, gesture.v0.w * gesture.d0 / d)); const h = w * MAP_H / MAP_W;
    const mid = fracIn(gesture.wrap, (a.x + b.x) / 2, (a.y + b.y) / 2);
    const cx = gesture.v0.x + gesture.v0.w * gesture.mid[0], cy = gesture.v0.y + gesture.v0.h * gesture.mid[1];
    setView(gesture.wrap.id, {x: cx - w * mid[0], y: cy - h * mid[1], w, h});
  } else if (gesture.type === 'drag'){
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) gesture.moved = true;
    if (!gesture.moved) return;
    const v = getView(gesture.wrap.id); const scale = v.w / gesture.wrap.clientWidth;
    setView(gesture.wrap.id, {x: gesture.vx - dx * scale, y: gesture.vy - dy * scale, w: v.w, h: v.h});
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && gesture.moved){ suppressClick = true; setTimeout(() => { suppressClick = false; }, 50); }
  if (ptrs.size === 0) gesture = null;
  else if (ptrs.size === 1){ const [a] = [...ptrs.values()]; const v = getView(a.wrap.id); gesture = {type: 'drag', wrap: a.wrap, sx: a.x, sy: a.y, vx: v.x, vy: v.y, moved: true}; }
}
document.addEventListener('pointerup', endPtr);
document.addEventListener('pointercancel', endPtr);
document.addEventListener('wheel', e => {
  const wrap = e.target.closest('.mapwrap'); if (!wrap) return;
  e.preventDefault();
  const [fx, fy] = fracIn(wrap, e.clientX, e.clientY);

}, {passive: false});
document.addEventListener('dblclick', e => {

/* ---------- music: a generated groove the snake dances to (Web Audio, no files needed) ---------- */
const music = (() => {
  const BPM = 112, SPB = 60 / BPM, STEP = SPB / 4;
  const ROOTS = [38, 41, 36, 43], QUAL = [[0,3,7],[0,4,7],[0,4,7],[0,4,7]];
  const BASS = [0,null,null,0, null,null,12,null, 0,null,7,null, 10,null,12,null];
  const KICK = [0,8,11], SNARE = [4,12], ARP = {1:0, 5:1, 9:2, 13:3};
  let ctx = null, master = null, noise = null, playing = false, timer = null, step = 0, nextT = 0;
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  function init(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.42;
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, t, peak, dec){ g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dec); }
  function osc(type, freq, t, dur, peak, dec){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); env(g, t, peak, dec); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur); }
  function kick(t){ const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); env(g, t, 1, 0.28); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3); }
  function hat(t, open){ const s = ctx.createBufferSource(); s.buffer = noise; const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000; const g = ctx.createGain(); env(g, t, open ? 0.22 : 0.15, open ? 0.18 : 0.045); s.connect(hp); hp.connect(g); g.connect(master); s.start(t); s.stop(t + 0.2); }
  function snare(t){ const s = ctx.createBufferSource(); s.buffer = noise; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; const g = ctx.createGain(); env(g, t, 0.45, 0.16); s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + 0.2); osc('sine', 190, t, 0.12, 0.45, 0.1); }
  function bass(t, m){ const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = f(m); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.2); env(g, t, 0.5, 0.22); o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25); }
  function stab(t, ms){ for (const m of ms) osc('triangle', f(m), t, 0.3, 0.08, 0.26); }
  function pluck(t, m){ osc('square', f(m), t, 0.18, 0.045, 0.14); }
  function schedule(st, t){
    const bar = Math.floor(st / 16) % 4, s = st % 16, root = ROOTS[bar], q = QUAL[bar];
    if (KICK.includes(s)) kick(t);
    if (SNARE.includes(s)) snare(t);
    if (s % 2 === 0) hat(t, s === 14);
    if (BASS[s] != null) bass(t, root + BASS[s]);
    if (s === 2 || s === 10) stab(t, q.map(i => root + 12 + i));
    if (ARP[s] != null){ const tones = [root + 24, root + 24 + q[1], root + 24 + q[2], root + 36]; pluck(t, tones[ARP[s]]); }
  }
  function tick(){ while (nextT < ctx.currentTime + 0.15){ schedule(step, nextT); nextT += STEP; step = (step + 1) % 64; } }
  function start(){
    if (playing) return;
    try { if (!ctx) init(); } catch(e) { return; }
    ctx.resume().catch(() => {});
    playing = true; step = 0; nextT = ctx.currentTime + 0.06; timer = setInterval(tick, 30); tick();
    document.body.classList.add('dancing'); document.documentElement.style.setProperty('--beat', SPB.toFixed(3) + 's');
    updateBtn();
  }
  function stop(){ if (!playing) return; playing = false; clearInterval(timer); if (ctx) ctx.suspend().catch(() => {}); document.body.classList.remove('dancing'); updateBtn(); }
  function updateBtn(){ const b = $('#musicBtn'); if (b){ b.classList.toggle('on', playing); b.textContent = playing ? '🎵' : '🔇'; b.setAttribute('aria-pressed', String(playing)); } }
  document.addEventListener('visibilitychange', () => { if (!ctx || !playing) return; if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {}); });
  return {start, stop, updateBtn, get playing(){ return playing; }};
})();

/* ---------- night (live tracking) ---------- */
let gpsWatch = null, demoToken = 0, tick = null;
function startNight(mode, ids){
  if (S.night) return;
  const planIds = ids || S.plan.ids.slice();
  S.night = {startedAt: Date.now(), mode, planIds, planName: S.plan.name, stops: [], trail: [], waters: 0, you: null, lastAuto: 0};
  save();
  if (mode === 'gps') startGPS();
  if (mode === 'demo') runDemo();
  render();
}
function currentStop(){ const n = S.night; if (!n || !n.stops.length) return null; const s = n.stops[n.stops.length-1]; return s.out ? null : s; }
function checkIn(id, auto){
  const n = S.night; if (!n) return;
  const cur = currentStop();
  if (cur && cur.id === id) return toast(`You're already at ${byId[id].name}`);
  if (cur) cur.out = Date.now();
  n.stops.push({id, in: Date.now(), out: null, photos: []});
  n.you = [byId[id].x, byId[id].y];
  n.trail.push([byId[id].x, byId[id].y, Date.now()]);
  n.nudge = true;
  save(); render();
  toast(`${auto ? 'Auto check-in' : 'Checked in'}: ${byId[id].name} 🐍`);
}
function leaveBar(){ const cur = currentStop(); if (cur) { cur.out = Date.now(); save(); render(); } }
function finishNight(){
  const n = S.night; if (!n) return;
  const score = snakeScore(n);
  openSheet(`<h3>Name your snake 🐍</h3><p class="muted small">${n.stops.length} stops, score ${score}. Locking freezes it for good. Upload it and it goes on Top Slither Nights.</p>
    <label class="f">Snake name<input id="snakeName" value="${esc(n.planName || '')}" placeholder="The Wharf Rat" maxlength="36"></label>
    <button class="btn primary block" id="lockUpload">Lock it &amp; upload to Top Slither Nights</button>
    <button class="btn block" id="lockSave">Lock it, keep it to the crew</button>
    <button class="btn ghost block" data-close>Keep going</button>`);
  const done = upload => {
    const name = $('#snakeName').value.trim();
    const cur = currentStop(); if (cur) cur.out = Date.now();
    n.endedAt = Date.now(); n.name = name || n.planName || 'Night out'; n.locked = true; n.uploaded = upload; n.score = snakeScore(n);
    stopGPS(); demoToken++;
    S.nights.unshift(n); S.night = null; S.recapIndex = 0;
    save(); closeSheet(); go('recap');
    toast(upload ? `${n.name} is on the board 🏆` : `${n.name} locked`);
  };
  $('#lockUpload').onclick = () => done(true); $('#lockSave').onclick = () => done(false);
  setTimeout(() => { const i = $('#snakeName'); if (i) i.focus(); }, 50);
}
function discardNight(){ stopGPS(); demoToken++; S.night = null; save(); render(); toast('Night discarded'); }
function pushPos(xy){
  const n = S.night; if (!n) return;
  n.you = xy;
  const last = n.trail[n.trail.length-1];
  if (!last || Math.hypot(last[0]-xy[0], last[1]-xy[1]) > 4) n.trail.push([xy[0], xy[1], Date.now()]);
  if (n.trail.length > 1500) n.trail.splice(0, n.trail.length - 1500);
}
function autoCheck(xy){
  const n = S.night; if (!n) return;
  const cur = currentStop();
  let best = null, bestD = 1e9;
  for (const b of BARS){ const d = distM(xy, [b.x, b.y]); if (d < bestD){ bestD = d; best = b; } }
  if (cur && best && best.id !== cur.id && bestD > 60 && distM(xy, [byId[cur.id].x, byId[cur.id].y]) > 80){ cur.out = Date.now(); save(); render(); }
  if (best && bestD <= 40 && (!cur || cur.id !== best.id) && Date.now() - n.lastAuto > 90000){ n.lastAuto = Date.now(); checkIn(best.id, true); }
}
function startGPS(){
  if (!('geolocation' in navigator)) { gpsFail('No location on this device.'); return; }
  try {
    gpsWatch = navigator.geolocation.watchPosition(pos => {
      const xy = toXY(pos.coords.latitude, pos.coords.longitude);
      pushPos(xy); autoCheck(xy); save(); renderLiveMapOnly();
    }, err => gpsFail(err && err.message ? err.message : 'Location unavailable'), {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  } catch(e) { gpsFail('Location blocked here.'); }
}
function gpsFail(msg){
  stopGPS();
  if (S.night && S.night.mode === 'gps'){ S.night.mode = 'manual'; S.night.gpsNote = msg; save(); render(); }
  toast('Location is off here. Tap a bar to check in.');
}
function stopGPS(){ if (gpsWatch != null && navigator.geolocation) { try { navigator.geolocation.clearWatch(gpsWatch); } catch(e){} } gpsWatch = null; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function runDemo(){
  const token = ++demoToken;
  const n = S.night; if (!n) return;
  let pos = [30, 296];
  n.you = pos; pushPos(pos);
  for (const id of n.planIds){
    if (demoToken !== token || !S.night) return;
    const b = byId[id]; const from = pos.slice(); const steps = 22;
    for (let i = 1; i <= steps; i++){
      if (demoToken !== token || !S.night) return;
      const t = i / steps; const wob = Math.sin(t * Math.PI * 3) * 6;
      pos = [from[0] + (b.x - from[0]) * t + wob, from[1] + (b.y - from[1]) * t - wob * .6];
      pushPos(pos); renderLiveMapOnly();
      await sleep(110);
    }
    pos = [b.x, b.y]; checkIn(id, true);
    await sleep(1800);
  }
  if (S.night && demoToken === token){ S.night.demoDone = true; save(); render(); toast('Demo walk finished. Hit Finish night for the recap.'); }
}
function addPhoto(file, barId){
  const n = S.night; if (!n || !file) return;
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => {
    const max = 720; const sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', .72);
    URL.revokeObjectURL(url);
    let stop = n.stops.find(s => s.id === barId && !s.out) || n.stops.slice().reverse().find(s => s.id === barId);
    if (!stop) { stop = {id: barId, in: Date.now(), out: Date.now(), photos: []}; n.stops.push(stop); }
    stop.photos.push({d: data, t: Date.now()});
    save(); render(); toast('Photo added to ' + byId[barId].name);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That image could not be read'); };
  img.src = url;
}

function nightStats(n){ const end = n.endedAt || Date.now(); let dist = 0; for (let i = 1; i < n.trail.length; i++) dist += distM(n.trail[i-1], n.trail[i]); const photos = n.stops.reduce((a, s) => a + s.photos.length, 0); return {stops: n.stops.length, ms: end - n.startedAt, km: dist/1000, photos, waters: n.waters}; }
function snakeScore(n){ const s = nightStats(n); return Math.round(s.stops*100 + s.km*40 + s.photos*15 + s.waters*25 + (s.stops >= 5 ? 150 : 0)); }
function board(){ const mine = S.nights.filter(n => n.uploaded).map(n => ({name: n.name, crew: 'You', stops: n.stops.length, km: nightStats(n).km, score: n.score || snakeScore(n), date: n.startedAt, mine: true, id: n.startedAt})); return [...SEED_TOP, ...mine].sort((a, b) => b.score - a.score); }

/* ---------- global click delegation ---------- */
document.addEventListener('click', e => {
  if (suppressClick) return;
  const t = e.target.closest('[data-tab],[data-zoom],[data-bar],[data-open],[data-act],[data-move],[data-area],[data-deal-cat],[data-show-deal],[data-del-deal],[data-ci],[data-recap],[data-suggest]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.zoom) return zoomAt(t.closest('.mapwrap').id, d.zoom === 'in' ? 0.65 : 1.5);
  if (d.bar) return openBar(d.bar);
  if (d.open) { if (e.target.closest('[data-act]')) return; return openBar(d.open); }
  if (d.act === 'add') { closeSheet(); return addToPlan(d.id); }
  if (d.act === 'remove') { closeSheet(); return removeFromPlan(d.id); }
  if (d.act === 'checkin') { closeSheet(); return checkIn(d.id); }
  if (d.suggest !== undefined) { const sg = SUGGESTED[Number(d.suggest)]; S.plan.ids = sg.ids.slice(); S.plan.name = sg.name; save(); if (S.music !== false) music.start(); render(); winkAll(); $("#main").scrollTop = 0; return toast(`${sg.name} loaded 😉`); }
  if (d.move) return movePlan(d.id, Number(d.move));
  if (d.area) { S.areaFilter = d.area; save(); return render(); }
  if (d.dealCat) { S.dealFilter = d.dealCat; save(); return render(); }
  if (d.showDeal) return showDeal(d.showDeal);
  if (d.delDeal) { S.deals = S.deals.filter(x => x.id !== d.delDeal); save(); return render(); }
  if (d.ci) { closeSheet(); return checkIn(d.ci); }
  if (d.recap !== undefined) { S.recapIndex = Number(d.recap); save(); return render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.matches('[data-open],[data-ci]')) e.target.click(); });
window.addEventListener('hashchange', offerIncomingPlan);
$('#musicBtn').onclick = () => { if (music.playing){ music.stop(); S.music = false; toast('Music off'); } else { S.music = true; music.start(); toast(music.playing ? 'Snake is vibing 🎵' : 'Audio is blocked here'); } save(); };

/* ---------- boot ---------- */
if (S.night && S.night.mode === 'gps') startGPS();
if (S.night && S.night.mode === 'demo' && !S.night.demoDone) { S.night.mode = 'manual'; save(); }
render();
offerIncomingPlan();
})();
</script>
</body>
</html>
